[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
grassline-proto = { path = "crates/proto" }
grassline-agents = { path = "crates/agents" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = "1"
iroh = "1.3"

# The `metadata` message is not released yet.
[patch.crates-io]
hypereffect = { path = "../hypereffect/rust/hypereffect" }
