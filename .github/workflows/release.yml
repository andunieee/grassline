name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  daemon:
    name: daemon (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            cross: true
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build grasslined
        shell: bash
        run: |
          if [[ "${{ matrix.cross }}" == "true" ]]; then
            cross build --release --locked -p grassline-daemon --target "${{ matrix.target }}"
          else
            cargo build --release --locked -p grassline-daemon --target "${{ matrix.target }}"
          fi

      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          name="grasslined-${version}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/grasslined" "dist/$name/"
          if [[ "${{ matrix.target }}" == *-linux-gnu ]]; then
            cp deploy/grasslined.tarball.service "dist/$name/grasslined.service"
          fi
          cp README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: daemon-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  packages:
    name: packages (${{ matrix.target }})
    needs: daemon
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            deb_arch: amd64
            rpm_arch: x86_64
            pacman_arch: x86_64
          - target: aarch64-unknown-linux-gnu
            deb_arch: arm64
            rpm_arch: aarch64
            pacman_arch: aarch64
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: daemon-${{ matrix.target }}
          path: dist

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm zstd

      - name: Build packages
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          name="grasslined-${version}-${{ matrix.target }}"
          tar -xzf "dist/$name.tar.gz" -C dist
          unit="deploy/grasslined.package.service"

          # Debian package
          deb_root="$(mktemp -d)"
          install -Dm755 "dist/$name/grasslined" "$deb_root/usr/bin/grasslined"
          install -Dm644 "$unit" "$deb_root/usr/lib/systemd/user/grasslined.service"
          install -Dm644 README.md "$deb_root/usr/share/doc/grasslined/README.md"
          mkdir -p "$deb_root/DEBIAN"
          cat > "$deb_root/DEBIAN/control" <<EOF
          Package: grasslined
          Version: ${version}
          Architecture: ${{ matrix.deb_arch }}
          Maintainer: andunie <andunie@cassis.cash>
          Installed-Size: $(du -sk "$deb_root/usr" | cut -f1)
          Section: utils
          Priority: optional
          Homepage: https://github.com/andunieee/grassline
          Description: Headless daemon for controlling coding agents remotely
          EOF
          dpkg-deb --build --root-owner-group "$deb_root" \
            "dist/grasslined_${version}_${{ matrix.deb_arch }}.deb"
          rm -rf "$deb_root"

          # RPM package
          rpm_top="$(mktemp -d)"
          mkdir -p "$rpm_top"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          cat > "$rpm_top/SPECS/grasslined.spec" <<EOF
          Name: grasslined
          Version: ${version}
          Release: 1
          Summary: Headless daemon for controlling coding agents remotely
          License: MIT OR Apache-2.0
          URL: https://github.com/andunieee/grassline
          AutoReqProv: no
          %global debug_package %{nil}
          %global __os_install_post %{nil}

          %description
          Grassline runs Claude Code, opencode, Codex and others on your own computer
          and lets you talk to them from your phone over iroh.

          %install
          install -Dm755 "$PWD/dist/$name/grasslined" %{buildroot}/usr/bin/grasslined
          install -Dm644 "$PWD/$unit" %{buildroot}/usr/lib/systemd/user/grasslined.service
          install -Dm644 "$PWD/README.md" %{buildroot}/usr/share/doc/grasslined/README.md

          %files
          /usr/bin/grasslined
          /usr/lib/systemd/user/grasslined.service
          /usr/share/doc/grasslined/README.md
          EOF
          rpmbuild -bb --target "${{ matrix.rpm_arch }}" \
            --define "_topdir $rpm_top" \
            --define "_rpmdir $PWD/dist/rpm" \
            "$rpm_top/SPECS/grasslined.spec"
          find dist/rpm -type f -name "grasslined-${version}-1.*.rpm" \
            -exec cp {} "dist/grasslined-${version}-1.${{ matrix.rpm_arch }}.rpm" \;
          rm -rf "$rpm_top" dist/rpm

          # Arch Linux package
          pacman_root="$(mktemp -d)"
          install -Dm755 "dist/$name/grasslined" "$pacman_root/usr/bin/grasslined"
          install -Dm644 "$unit" "$pacman_root/usr/lib/systemd/user/grasslined.service"
          install -Dm644 README.md "$pacman_root/usr/share/doc/grasslined/README.md"
          cat > "$pacman_root/.PKGINFO" <<EOF
          pkgname = grasslined
          pkgbase = grasslined
          pkgver = ${version}-1
          pkgdesc = Headless daemon for controlling coding agents remotely
          url = https://github.com/andunieee/grassline
          builddate = $(date +%s)
          packager = andunie <andunie@cassis.cash>
          size = $(du -sb "$pacman_root/usr" | cut -f1)
          arch = ${{ matrix.pacman_arch }}
          license = MIT
          license = Apache-2.0
          depend = glibc
          depend = gcc-libs
          EOF
          (cd "$pacman_root" && tar --zstd --owner=0 --group=0 --numeric-owner \
            -cf "$OLDPWD/dist/grasslined-${version}-1-${{ matrix.pacman_arch }}.pkg.tar.zst" \
            .PKGINFO usr)
          rm -rf "$pacman_root"

          for package in \
            "dist/grasslined_${version}_${{ matrix.deb_arch }}.deb" \
            "dist/grasslined-${version}-1.${{ matrix.rpm_arch }}.rpm" \
            "dist/grasslined-${version}-1-${{ matrix.pacman_arch }}.pkg.tar.zst"; do
            (cd dist && sha256sum "$(basename "$package")" > "$(basename "$package").sha256")
          done

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.target }}
          path: |
            dist/*.deb*
            dist/*.rpm*
            dist/*.pkg.tar.zst*
          if-no-files-found: error

  android:
    name: android apk
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit count is the version code, so it must keep increasing.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          key: android

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Find the NDK
        shell: bash
        run: |
          ndk="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [[ -z "$ndk" ]]; then
            sdk="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
            ndk="$(ls -d "$sdk"/ndk/* 2>/dev/null | sort -V | tail -n1)"
          fi
          if [[ -z "$ndk" ]]; then
            echo "no Android NDK found" >&2
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"
          echo "using NDK $ndk"

      - name: Build the Rust libraries
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a \
            -o android/app/src/main/jniLibs \
            build --release --locked -p grassline-mobile

      - name: Set up signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret: the APK will be signed with the debug key."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            echo "GRASSLINE_KEYSTORE=$RUNNER_TEMP/release.keystore"
            echo "GRASSLINE_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "GRASSLINE_KEY_ALIAS=$KEY_ALIAS"
            echo "GRASSLINE_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Set the version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "GRASSLINE_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "GRASSLINE_VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Build the APK
        run: ./android/gradlew -p android --no-daemon assembleRelease

      - name: Collect the APK
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          apk="$(find android/app/build/outputs/apk/release -name '*.apk' | head -n1)"
          if [[ -z "$apk" ]]; then
            echo "no release APK was built" >&2
            exit 1
          fi
          cp "$apk" "dist/grassline-${version}.apk"
          (cd dist && sha256sum "grassline-${version}.apk" > "grassline-${version}.apk.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*
          if-no-files-found: error

  release:
    name: publish
    needs: [daemon, packages, android]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
